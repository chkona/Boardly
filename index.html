<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ბორდლი — ონლაინ სამაგიდო თამაშები</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1020;--card:#171b33;--bd:#2a3058;--tx:#e8eaff;--mu:#9aa0c8;--ac:#7c6cff;--ac2:#4f8cff;--ok:#3ecf8e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f4fb;--card:#fff;--bd:#d9dcf0;--tx:#1b1f3a;--mu:#5d6389}}
:root[data-theme=light]{--bg:#f3f4fb;--card:#fff;--bd:#d9dcf0;--tx:#1b1f3a;--mu:#5d6389}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:'Noto Sans Georgian',system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font-weight:700;font-size:20px;display:flex;gap:8px;align-items:center;color:var(--tx);text-decoration:none}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-style:normal;color:#fff;font-size:16px}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav a{padding:8px 12px;border-radius:10px;color:var(--mu);text-decoration:none;white-space:nowrap;font-size:14px}
nav a.on,nav a:hover{background:var(--card);color:var(--tx)}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:clamp(26px,6vw,42px);line-height:1.2;margin:8px 0}h2{font-size:20px;margin:24px 0 12px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:12px 18px;border-radius:12px;font:600 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
.btn.s{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.cov{height:110px;display:grid;place-items:center;font-size:44px}.cb{padding:12px}
.cb p{color:var(--mu);font-size:13px;margin:4px 0 10px}.tag{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;color:var(--mu);margin-right:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font:inherit;min-height:44px;max-width:100%}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.pl{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.sp{outline:2px solid var(--ok);animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 0 6px #3ecf8e33}}@media(prefers-reduced-motion:reduce){.sp{animation:none}}
.chat{height:200px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}.m{background:var(--bg);padding:6px 10px;border-radius:10px;font-size:14px;max-width:85%}.m.me{align-self:flex-end;background:var(--ac)}.sys{color:var(--mu);font-size:12px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.table{background:radial-gradient(ellipse,#14573f,#0a2a20);border-radius:24px;padding:20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;border:6px solid #1c1a33}
.pc{display:inline-grid;place-items:center;width:46px;height:66px;background:#fff;color:#c0262d;border-radius:8px;font-weight:700;margin:0 -6px;box-shadow:0 2px 6px #0006}.pc.k{color:#111}.pc.b{background:linear-gradient(135deg,var(--ac),#2b2670);color:#fff}
.dim{opacity:.5;pointer-events:none}.note{background:var(--card);border:1px dashed var(--ac);border-radius:12px;padding:10px;font-size:13px;color:var(--mu)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#06251a;padding:10px 16px;border-radius:12px;display:none;z-index:9;font-weight:600}
</style></head><body>
<header><a class="logo" href="#/"><i>♞</i>ბორდლი</a><nav id="nav" aria-label="მთავარი ნავიგაცია"></nav><button class="btn s" id="th" aria-label="თემის შეცვლა">◐</button></header>
<main id="app"></main><div id="toast" role="status"></div>
<script>
const G=[
{id:'bura',t:'ბურა',c:'კარტი',e:'🂡',d:'ტრადიციული ქართული კარტის თამაში ორი ან სამი მოთამაშისთვის.',p:[2,4],m:20,df:'საშუალო',g:['#14573f','#0a2a20']},
{id:'durak',t:'დურაკა',c:'კარტი',e:'🂮',d:'თავდასხმა და დაცვა — ვინ დარჩება ბოლოს კარტებით?',p:[2,6],m:15,df:'მარტივი',g:['#7c2d3a','#2d1220']},
{id:'joker',t:'ჯოკერი',c:'კარტი',e:'🃏',d:'ოთხკაციანი თამაში ანგარიშებით და სტრატეგიით.',p:[4,4],m:45,df:'რთული',g:['#6a3fd0','#251a52']},
{id:'uno',t:'UNO',c:'კარტი',e:'🎴',d:'ფერადი კარტები და სწრაფი გადაწყვეტილებები.',p:[2,8],m:20,df:'მარტივი',g:['#d94f3d','#e8b62c']},
{id:'catan',t:'კატანი',c:'სტრატეგია',e:'⬡',d:'ააშენე დასახლებები, ივაჭრე რესურსებით, გაიმარჯვე კუნძულზე.',p:[3,4],m:75,df:'რთული',g:['#3a7d44','#c9a227']},
{id:'chess',t:'ჭადრაკი',c:'კლასიკური',e:'♟',d:'მარადიული კლასიკა ორი მოთამაშისთვის.',p:[2,2],m:30,df:'საშუალო',g:['#3b3f5c','#1a1d33']},
{id:'nardi',t:'ნარდი',c:'კლასიკური',e:'🎲',d:'კამათელი, ტაქტიკა და ქართული ტრადიცია.',p:[2,2],m:20,df:'საშუალო',g:['#8a5a2b','#3d2612']},
{id:'dixit',t:'დიქსიტი',c:'სოციალური',e:'🌙',d:'ასოციაციები და ფანტაზია სიურრეალისტურ სურათებზე.',p:[3,6],m:30,df:'მარტივი',g:['#5b6cff','#b05bd6']},
{id:'codenames',t:'კოდნეიმსი',c:'სიტყვიერი',e:'🔤',d:'გუნდური სიტყვების თამაში მინიშნებებით.',p:[4,8],m:25,df:'საშუალო',g:['#c0392b','#2456c5']},
{id:'coup',t:'ქოუპი',c:'სოციალური',e:'👑',d:'ბლეფი, ინტრიგა და ბოლომდე გადარჩენა.',p:[2,6],m:15,df:'საშუალო',g:['#2a2142','#6b2d5c']}];
const U=[['გიორგი','#7c6cff'],['ნიკა','#e0645c'],['ანა','#2fb59a'],['მარიამი','#d9a441'],['ლუკა','#4f8cff'],['საბა','#b05bd6']];
const R=[['მეგობრების საღამო','bura','გიორგი',3,4,1],['ბურას მოყვარულები','bura','ნიკა',2,4,0],['სტრატეგების ოთახი','catan','ანა',3,4,1],['ღამის თამაშები','uno','ლუკა',5,8,1],['ახალი მოთამაშეები','chess','საბა',1,2,0]];
const S={fav:new Set(['bura']),ready:false,mic:false,muted:false,q:'',cat:'ყველა',sort:'popular',room:null,fr:['ანა','ლუკა'],chat:[['სისტემა','ოთახი შეიქმნა. კარგ თამაშს გისურვებთ!',1],['ანა','გამარჯობა! მზად ვარ 🙂',0]],notes:[['ანა გიგზავნის მეგობრობის მოთხოვნას',0],['გიორგი გიწვევს ბურაზე',0],['ბორდლის დემო ვერსია გაიხსნა',1]]};
const $=s=>document.querySelector(s),gm=id=>G.find(x=>x.id===id);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)};
const av=(n,c,x='')=>`<div class="av ${x}" style="background:${c}" aria-hidden="true">${n[0]}</div>`;
const cover=g=>`<div class="cov" style="background:linear-gradient(135deg,${g.g[0]},${g.g[1]})" aria-hidden="true">${g.e}</div>`;
const gcard=g=>`<article class="card">${cover(g)}<div class="cb"><b>${g.t}</b> <span class="tag">${g.c}</span><p>${g.d}</p><div style="font-size:12px;color:var(--mu)">👥 ${g.p[0]}–${g.p[1]} · ⏱ ${g.m} წთ · ${g.df}</div><div class="row" style="margin-top:10px"><a class="btn s" href="#/game/${g.id}">დეტალები</a><button class="btn" onclick="location.hash='#/create/${g.id}'">თამაში</button><button class="btn s" aria-label="რჩეულებში" onclick="fav('${g.id}')">${S.fav.has(g.id)?'★':'☆'}</button></div></div></article>`;
function fav(id){S.fav.has(id)?S.fav.delete(id):S.fav.add(id);toast(S.fav.has(id)?'დაემატა რჩეულებში':'ამოღებულია რჩეულებიდან');route()}
const unread=()=>S.notes.filter(n=>!n[1]).length;
const pages={
'':()=>`<section><h1>ითამაშე სამაგიდო თამაშები მეგობრებთან ერთად</h1><p style="color:var(--mu);max-width:560px">შექმენი ოთახი, მოიწვიე მეგობრები და ისიამოვნე ბურით, ჭადრაკით, კატანით და სხვა თამაშებით — ქართულად.</p><div class="row"><button class="btn" onclick="location.hash='#/dashboard'">თამაშის დაწყება</button><a class="btn s" href="#/games">გაიგე მეტი</a></div><p class="note">⚠ დემო რეჟიმი: ავტორიზაცია, ოთახები და თამაშის წესები ჯერ არ მუშაობს.</p></section><h2>პოპულარული თამაშები</h2><div class="grid">${G.slice(0,4).map(gcard).join('')}</div>`,
'dashboard':()=>`<h1>გამარჯობა, გიორგი 👋</h1><div class="row"><span class="tag">🟢 ონლაინ</span><button class="btn" onclick="location.hash='#/games'">თამაშის დაწყება</button><a class="btn s" href="#/create">ოთახის შექმნა</a><button class="btn s" onclick="toast('მოწვევის ბმული დაკოპირდა (დემო)')">მეგობრების მოწვევა</button></div><h2>რჩეული თამაშები</h2><div class="grid">${[...S.fav].map(gm).map(gcard).join('')||'<p class="note">ჯერ არაფერი გაქვთ რჩეულებში. აირჩიეთ ★ თამაშების გვერდზე.</p>'}</div><h2>საჯარო ოთახები</h2>${rooms(R.slice(0,3))}<h2>ონლაინ მეგობრები</h2><div class="row">${S.fr.map(n=>{const u=U.find(x=>x[0]==n);return `<div class="pl">${av(n,u[1])}${n}</div>`}).join('')}</div>`,
'games':()=>{let l=G.filter(g=>(S.cat=='ყველა'||g.c==S.cat)&&g.t.toLowerCase().includes(S.q.toLowerCase()));if(S.sort=='time')l.sort((a,b)=>a.m-b.m);if(S.sort=='name')l.sort((a,b)=>a.t.localeCompare(b.t,'ka'));return `<h1>თამაშები</h1><div class="row"><input id="q" placeholder="ძებნა…" aria-label="ძებნა" value="${S.q}"><select id="cat" aria-label="კატეგორია">${['ყველა','კარტი','სტრატეგია','კლასიკური','სოციალური','სიტყვიერი'].map(c=>`<option ${c==S.cat?'selected':''}>${c}</option>`)}</select><select id="so" aria-label="დალაგება"><option value="popular">პოპულარული</option><option value="time" ${S.sort=='time'?'selected':''}>ხანგრძლივობა</option><option value="name" ${S.sort=='name'?'selected':''}>სახელი</option></select></div><h2></h2><div class="grid">${l.map(gcard).join('')||'<p class="note">ვერაფერი მოიძებნა.</p>'}</div>`},
'rooms':()=>`<h1>საჯარო ოთახები</h1><p class="note">ეს დემო ოთახებია — რეალური ოთახები მოგვიანებით დაემატება.</p>${rooms(R)}`,
'friends':()=>`<h1>მეგობრები</h1><h2>მოთხოვნები</h2>${['მარიამი','საბა'].map(n=>`<div class="pl" id="rq${n}">${av(n,'#7c6cff')}<b>${n}</b><span style="margin-left:auto" class="row"><button class="btn" onclick="S.fr.push('${n}');document.getElementById('rq${n}').remove();toast('დაემატა')">მიღება</button><button class="btn s" onclick="document.getElementById('rq${n}').remove()">უარყოფა</button></span></div>`).join('')}<h2>მეგობრები</h2><div class="grid">${S.fr.map(n=>`<div class="pl">${av(n,'#2fb59a')}${n}<button class="btn s" style="margin-left:auto" onclick="toast('მოწვევა გაიგზავნა (დემო)')">მოწვევა</button></div>`).join('')}</div>`,
'notifications':()=>`<h1>შეტყობინებები</h1><button class="btn s" onclick="S.notes.forEach(n=>n[1]=1);route()">ყველას წაკითხვა</button><h2></h2>${S.notes.map((n,i)=>`<div class="pl" style="margin-bottom:8px;opacity:${n[1]?.6:1}">🔔 <span>${n[0]}</span><button class="btn s" style="margin-left:auto" onclick="S.notes[${i}][1]=1;route()">წაკითხულია</button></div>`).join('')}`,
'profile':()=>`<div class="card"><div class="cov" style="background:linear-gradient(135deg,var(--ac),var(--ac2));height:90px"></div><div class="cb row">${av('გიორგი','#7c6cff')}<div><b>გიორგი</b><div style="color:var(--mu);font-size:13px">@giorgi_demo · დონე 7 (დემო სტატისტიკა)</div></div></div></div><h2>სტატისტიკა</h2><div class="grid"><div class="pl">🎮 124 თამაში</div><div class="pl">🏆 68 გამარჯვება</div><div class="pl">⭐ 9 მიღწევა</div></div>`,
'settings':()=>`<h1>პარამეტრები</h1><div class="pl" style="margin-bottom:8px">თემა <button class="btn s" style="margin-left:auto" onclick="$('#th').click()">შეცვლა</button></div>${['მეგობრობის მოთხოვნები','მოწვევები','განცხადებები'].map(x=>`<label class="pl"><input type="checkbox" checked> ${x}</label>`).join('<div style="height:8px"></div>')}`,
'help':()=>`<h1>დახმარება</h1><p>1. აირჩიე თამაში. 2. შექმენი ოთახი. 3. მოიწვიე მეგობრები. 4. დაიწყეთ თამაში.</p><p class="note">წესების გვერდები, კონტაქტი და სხვა გვერდები შემდეგ ეტაპზე დაემატება.</p>`
};
function rooms(l){return `<div class="grid">${l.map(r=>{const g=gm(r[1]);return `<article class="card">${cover(g)}<div class="cb"><b>${r[0]}</b><p>${g.t} · მასპინძელი: ${r[2]} · ${r[3]}/${r[4]} · ${r[5]?'🎙 ხმოვანი':'ხმის გარეშე'}</p><button class="btn" onclick="S.room={name:'${r[0]}',g:'${r[1]}',code:'DEMO'};location.hash='#/lobby'">შეერთება</button></div></article>`}).join('')}</div>`}
function gamePage(id){const g=gm(id);return `<div class="card">${cover(g)}<div class="cb"><h1>${g.t}</h1><span class="tag">${g.c}</span><p>${g.d}</p><p>👥 ${g.p[0]}–${g.p[1]} · ⏱ ${g.m} წთ · სირთულე: ${g.df}</p><p class="note">ვიზუალური პროტოტიპი — სრული თამაში ჯერ მიუწვდომელია.</p><div class="row"><button class="btn" onclick="location.hash='#/create/${id}'">ოთახის შექმნა</button><button class="btn s" onclick="fav('${id}')">${S.fav.has(id)?'★ რჩეულია':'☆ რჩეულებში'}</button></div></div></div>`}
function createPage(id){return `<h1>ოთახის შექმნა</h1><div class="card cb" style="display:grid;gap:12px;max-width:520px"><label>თამაში<br><select id="cg">${G.map(g=>`<option value="${g.id}" ${g.id==id?'selected':''}>${g.t}</option>`)}</select></label><label>ოთახის სახელი<br><input id="cn" style="width:100%" placeholder="მაგ: მეგობრების საღამო"></label><label><input type="checkbox" id="cp"> კერძო ოთახი</label><label><input type="checkbox" id="cv" checked> ხმოვანი ჩატი (დემო)</label><div id="er" style="color:#ff7a7a"></div><button class="btn" id="mk">შექმნა</button></div>`}
function lobby(){const r=S.room||{name:'დემო ოთახი',g:'bura',code:'DEMO'},g=gm(r.g);return `<h1>${r.name}</h1><div class="row"><span class="tag">${g.t}</span><span class="tag">კოდი: <b>${r.code}</b></span><button class="btn s" onclick="navigator.clipboard&&navigator.clipboard.writeText('${r.code}');toast('კოდი დაკოპირდა')">კოპირება</button></div><p class="note">დემო ოთახი — რეალური ონლაინ ოთახი არ შექმნილა.</p><div class="two"><div><h2>მოთამაშეები</h2><div style="display:grid;gap:8px">${U.slice(0,3).map((u,i)=>`<div class="pl">${av(u[0],u[1],S.mic&&!S.muted&&i==0?'sp':'')}<b>${u[0]}</b>${i==0?'<span class="tag">მასპინძელი</span>':''}<span style="margin-left:auto">${i==0?(S.ready?'✅ მზადაა':'⏳'):'✅'}</span></div>`).join('')}<div class="pl" style="opacity:.5">+ თავისუფალი ადგილი</div></div><div class="row" style="margin-top:12px"><button class="btn s" onclick="S.ready=!S.ready;route()">${S.ready?'მზად არ ვარ':'მზად ვარ'}</button><a class="btn" href="#/table/${g.id}">თამაშის დაწყება</a><button class="btn s" onclick="if(confirm('დარწმუნებული ხართ, რომ გსურთ გასვლა?'))location.hash='#/dashboard'">გასვლა</button></div><h2>ხმოვანი ჩატი (სიმულაცია)</h2><div class="row"><button class="btn s" onclick="S.mic=!S.mic;route()">${S.mic?'🎙 მიკროფონი ჩართულია':'🔇 მიკროფონი გამორთულია'}</button><button class="btn s" onclick="S.muted=!S.muted;route()">${S.muted?'ხმის ჩართვა':'დადუმება'}</button></div><p style="font-size:12px;color:var(--mu)">რეალური მიკროფონი არ გააქტიურდება ამ ეტაპზე.</p></div><div>${chat()}</div></div>`}
function chat(){return `<h2>ჩატი</h2><div class="card"><div class="chat" id="ch">${S.chat.map(m=>m[2]?`<div class="sys">${m[1]}</div>`:`<div class="m ${m[0]=='გიორგი'?'me':''}"><b style="font-size:12px">${m[0]}</b><br>${m[1]}</div>`).join('')}</div><form class="row" style="padding:8px" onsubmit="event.preventDefault();const i=this.t;if(i.value.trim()){S.chat.push(['გიორგი',i.value.replace(/</g,'&lt;'),0]);route()}"><input name="t" aria-label="შეტყობინება" placeholder="დაწერე შეტყობინება…" style="flex:1"><button class="btn">გაგზავნა</button></form></div>`}
function table(id){const g=gm(id),cards=(n,b)=>Array.from({length:n},(_,i)=>`<span class="pc ${b?'b':i%2?'k':''}">${b?'♦':['7♥','9♠','A♥','K♠','10♥'][i%5]}</span>`).join('');
return `<div class="row"><h1 style="flex:1">${g.t} — სათამაშო მაგიდა</h1><button class="btn s" onclick="if(confirm('გსურთ თამაშიდან გასვლა?'))location.hash='#/dashboard'">გასვლა</button></div><p class="note">ვიზუალური პროტოტიპი: წესები და სვლები ჯერ არ მუშაობს.</p><div class="table"><div>ნიკა ${cards(5,1)}</div><div style="color:#fff">ცენტრი · გოზირი: ♥ ${cards(2,0)}</div><div>${av('გიორგი','#7c6cff','sp')}<br>${cards(5,0)}<div class="row" style="justify-content:center;margin-top:10px"><button class="btn dim">სვლა</button><button class="btn dim">გავლა</button></div></div></div>${chat()}`}
function route(){const h=location.hash.replace('#/','').split('/'),k=h[0];let v;
if(k=='game')v=gamePage(h[1]);else if(k=='create')v=createPage(h[1]);else if(k=='lobby')v=lobby();else if(k=='table')v=table(h[1]||'bura');else v=(pages[k]||(()=>`<h1>404</h1><p>გვერდი ვერ მოიძებნა.</p><a class="btn" href="#/">მთავარი</a>`))();
$('#app').innerHTML=v;document.title='ბორდლი';
const L=[['','მთავარი'],['games','თამაშები'],['rooms','ოთახები'],['friends','მეგობრები'],['notifications','შეტყობ.'+(unread()?' ('+unread()+')':'')],['profile','პროფილი'],['settings','პარამეტრები'],['help','დახმარება']];
$('#nav').innerHTML=L.map(l=>`<a href="#/${l[0]}" class="${l[0]==k?'on':''}">${l[1]}</a>`).join('');
const q=$('#q');if(q){q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;route();const n=$('#q');n.focus();n.setSelectionRange(p,p)};$('#cat').onchange=e=>{S.cat=e.target.value;route()};$('#so').onchange=e=>{S.sort=e.target.value;route()}}
const mk=$('#mk');if(mk)mk.onclick=()=>{const n=$('#cn').value.trim();if(n.length<3){$('#er').textContent='ოთახის სახელი მინიმუმ 3 სიმბოლოა.';return}S.room={name:n,g:$('#cg').value,code:Math.random().toString(36).slice(2,6).toUpperCase()};toast('დემო ოთახი შეიქმნა');location.hash='#/lobby'};
const c=$('#ch');if(c)c.scrollTop=c.scrollHeight}
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='light'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:light)').matches);r.dataset.theme=d?'dark':'light'};
addEventListener('hashchange',()=>{scrollTo(0,0);route()});route();
</script></body></html>
